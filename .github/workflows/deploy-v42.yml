name: deploy-v42
on:
  push:
    paths:
      - manifest.json
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PAGE_URL: https://aka.doubaocdn.com/s/7INXGPRCVH
      PAGE_SHA: c6fd59896716cd7c2a685982633ea7a0081e091ab3aa8fd794a17b5f4d0a6bdb
    steps:
      - uses: actions/checkout@v4
      - name: Fetch tested page
        run: |
          curl -fsSL --retry 3 "$PAGE_URL" -o page.html
          echo "$PAGE_SHA  page.html" | sha256sum -c -
      - name: Commit page
        run: |
          mv page.html "远星航程.html"
          git config user.name doubao-agent
          git config user.email agent@users.noreply.github.com
          git add "远星航程.html"
          if git diff --cached --quiet; then echo 'no change'; exit 0; fi
          git commit -m "v42: 登录引导真模态、顶栏账号入口、读数合并、CDN 兜底"
          git push
