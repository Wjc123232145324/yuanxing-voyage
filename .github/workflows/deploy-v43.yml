name: deploy-v43
on:
  push:
    paths:
      - .deploy/trigger
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PAGE_URL: https://aka.doubaocdn.com/s/hUgx2FPnj0
      PAGE_SHA: 75c241616c805702b941383ebf8f25de692f38f98d18acefb8fea132775a97b8
    steps:
      - uses: actions/checkout@v4
      - name: Fetch tested page
        run: |
          curl -fsSL --retry 3 "$PAGE_URL" -o page.html
          echo "$PAGE_SHA  page.html" | sha256sum -c -
      - name: Commit page
        run: |
          mv page.html "远星航程.html"
          git config user.name doubao-agent
          git config user.email agent@users.noreply.github.com
          git add "远星航程.html"
          if git diff --cached --quiet; then echo 'no change'; exit 0; fi
          git commit -m "v43: 清理 !important，统一输入控件与选中态描边"
          git push
