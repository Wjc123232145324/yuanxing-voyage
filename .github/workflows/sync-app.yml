name: Sync App
on:
  push:
    paths:
      - '.github/workflows/sync-app.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download build
        run: curl -L --retry 3 'https://aka.doubaocdn.com/s/m3q6rXgTNK' -o app.html
      - name: Commit
        run: |
          cp app.html '远星航程.html'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '远星航程.html'
          git commit -m 'feat: captain archive and title sigils' || true
          git push
