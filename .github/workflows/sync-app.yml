name: sync-app
on:
  push:
    paths-ignore:
      - 远星航程.html
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: pull
        run: |
          curl -sSL --retry 4 --max-time 120 -o /tmp/app.html "https://aka.doubaocdn.com/s/rKqryRFWtM"
          test "$(stat -c %s /tmp/app.html)" -gt 340000
          cp /tmp/app.html 远星航程.html
      - name: commit
        run: |
          git config user.name "Wjc123232145324"
          git config user.email "wjc_china2022@163.com"
          git add 远星航程.html
          git commit -m "sync: v20 daily route weekly report pwa"
          git push
