name: sync-app
on:
  push:
    paths:
      - '.github/workflows/sync-app.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull app
        run: curl -L --fail --retry 3 --http1.1 -o "远星航程.html" "https://aka.doubaocdn.com/s/mCoWCRqufD"
      - name: Commit sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "远星航程.html"
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "Sync app v36 final polish"
            git push
          fi
