name: sync-app
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-app.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull latest artifact
        run: curl -L --retry 3 --fail -o 远星航程.html "https://aka.doubaocdn.com/s/Negq7xj6k7"
      - name: Commit and push
        run: |
          git config user.name "sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"
          git add 远星航程.html
          git diff --cached --quiet || git commit -m "sync: 远星航程 first-run resume weekly-check"
          git push
