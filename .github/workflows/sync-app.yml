name: sync-app

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync-app.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download latest app
        run: curl -sSL --http1.1 --max-time 300 'https://aka.doubaocdn.com/s/mjU0MmVskw' -o '远星航程.html'
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '远星航程.html'
          git commit -m 'chore: sync app v26 account system' || exit 0
          git push
